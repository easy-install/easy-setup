name: Test

permissions:
  contents: write

on:
  push:
  pull_request:

defaults:
  run:
    shell: bash --noprofile --norc -CeEuo pipefail {0}

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  rust-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - name: url list
        uses: ./
        with:
          url: |-
            https://github.com/ahaoboy/mujs-build
            quickjs-ng/quickjs --name qjs --alias qjs-ng
            https://github.com/pocket-nexus/quickjs-oxide --alias qjs-oxide
            https://github.com/ahaoboy/easy-install/raw/refs/heads/main/dist-manifest/llrt.json
            https://github.com/ahaoboy/easy-install/raw/refs/heads/main/dist-manifest/bun.json
            https://github.com/denoland/deno
            https://github.com/ahaoboy/txiki.js-build
            https://github.com/ahaoboy/spidermonkey-build
            https://github.com/ahaoboy/v8-build
            https://github.com/ahaoboy/jsc-build
            https://github.com/ahaoboy/jerryscript-build
            https://github.com/ahaoboy/mujs-build
            https://github.com/ahaoboy/quickjs-build
            https://github.com/axodotdev/cargo-dist
            https://github.com/Schniz/fnm
      - name: test
        run: |
          deno --version
          ei --version
          qjs -e "console.log(1)"
          qjs-ng -e "console.log(1)"
          qjs-oxide -e "console.log(1)"

          echo "console.log(1+1)" >> ./test.js
          qjs ./test.js
          mujs ./test.js

          ls -lh ~/.ei

          which llrt
          which fnm
          fnm --version
          llrt --version
          bun --version

      - name: show ~/.ei structure (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          function Format-EiSize([long] $Bytes) {
            $units = 'B', 'KB', 'MB', 'GB', 'TB'
            $value = [double] $Bytes
            $index = 0
            while ($value -ge 1024 -and $index -lt ($units.Count - 1)) {
              $value = $value / 1024
              $index++
            }
            if ($index -eq 0) { '{0:N0} {1}' -f $value, $units[$index] }
            else { '{0:N1} {1}' -f $value, $units[$index] }
          }

          Push-Location "$HOME\.ei"
          Get-ChildItem -Recurse -Depth 1 |
            Sort-Object FullName |
            ForEach-Object {
              $size = if ($_.PSIsContainer) { '<DIR>' } else { Format-EiSize $_.Length }
              '{0,12}  {1}' -f $size, $_.FullName.Substring($PWD.Path.Length + 1)
            }
          Pop-Location

      - name: show ~/.ei structure (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd ~/.ei
          human_size() {
            awk -v bytes="$1" 'BEGIN {
              split("B KB MB GB TB", units, " ")
              value = bytes
              i = 1
              while (value >= 1024 && i < 5) {
                value = value / 1024
                i++
              }
              if (i == 1) printf "%d %s", value, units[i]
              else printf "%.1f %s", value, units[i]
            }'
          }

          find . -mindepth 1 -maxdepth 2 | sort | while IFS= read -r path; do
            if [ -d "$path" ]; then
              size="<DIR>"
            else
              size="$(human_size "$(wc -c <"$path")")"
            fi
            printf '%12s  %s\n' "$size" "$path"
          done
